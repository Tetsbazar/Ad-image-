<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ধরুনের ফ্রেশ ফ্রুট শপ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f9f4;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            color: white;
            text-align: center;
            padding: 30px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        /* মেইন ছবি */
        .main-image {
            width: 100%;
            max-width: 600px;
            border-radius: 15px;
            border: 5px solid #FF9800;
            margin: 20px auto;
            display: block;
        }

        /* একাধিক ছবির গ্যালারি */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid #4CAF50;
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        h2 {
            color: #E65100;
            text-align: center;
        }

        .order-btn {
            display: block;
            width: fit-content;
            margin: 30px auto;
            background-color: #FF9800;
            color: white;
            padding: 15px 30px;
            font-size: 1.2em;
            text-decoration: none;
            border-radius: 50px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍏 ধরুনের ফ্রেশ ফ্রুট শপ</h1>
        <p>সেরা মানের তাজা ও অর্গানিক ফল</p>
    </header>

    <div class="container">
        <h2>আমাদের দোকানে স্বাগতম!</h2>
        
        <!-- মেইন ছবি (photo.png) -->
        <img src="photo.png" alt="ধরুনের ফ্রুট শপ" class="main-image">
        
        <p style="text-align: center; font-size: 1.1em;">
            আমরা সবসময় গ্রাহকদের কাছে পৌঁছে দিই একদম বাগান থেকে তোলা তাজা ফল।
        </p>

        <!-- একাধিক ছবির গ্যালারি -->
        <h2> আমাদের ফলের সংগ্রহ</h2>
        
        <div class="gallery">
            <!-- নতুন ছবি ১ -->
            <img src="photo2.png" alt="ফল ১">
            
            <!-- নতুন ছবি ২ -->
            <img src="mango.jpg" alt="আম">
            
            <!-- নতুন ছবি ৩ -->
            <img src="apple.jpg" alt="আপেল">
            
            <!-- নতুন ছবি ৪ -->
            <img src="photo3.png" alt="ফল ৪">
        </div>

        <a href="#" class="order-btn">🛒 এখনই অর্ডার করুন</a>
    </div>

</body>
</html>
